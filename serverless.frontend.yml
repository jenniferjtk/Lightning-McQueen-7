# React frontend (Vite build in dist/) served from Lambda, attached to the
# existing HTTP API created by backend/serverless.yml so the app and /api/*
# share one origin. Deploy from the repo root:
#   npm run build && npx serverless deploy --config serverless.frontend.yml
org: jennagracejohnson3
app: lightning-mcqueen
service: lightning-mcqueen-frontend

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-2
  deploymentBucket:
    name: team07-lightning-mcqueen-deploy
  httpApi:
    id: 1fpzbaz91l

package:
  patterns:
    - '!**'
    - frontend.js
    - package.json
    - dist/**

functions:
  frontend:
    handler: frontend.handler
    events:
      - httpApi:
          path: /
          method: get
      - httpApi:
          path: /{proxy+}
          method: get
